<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#2c3e50">
    <title>{% block title %}Instituto Jorge Müller{% endblock %}</title>
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}?v=20260411a">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
</head>
<body data-page="{% block page_id %}{% endblock %}">
    
    <div class="layout-wrapper">
        
        <!-- SIDEBAR MODERNO -->
        <aside class="sidebar">
            <div class="sidebar-brand" onclick="window.location.href='/'" style="cursor: pointer;">
                <img src="{{ url_for('static', filename='logo.svg') }}" alt="MÜLLER" class="sidebar-logo" style="cursor: pointer;">
                <div class="sidebar-brand-text" style="cursor: pointer;">MÜLLER</div>
            </div>
            
            <nav>
                <ul class="sidebar-nav">
                    <li class="sidebar-nav-item">
                        <a href="/tab/1" class="sidebar-nav-link">
                            <span class="icon-wrapper"><i class="fas fa-clipboard-list"></i></span> <span>Asistencia</span>
                        </a>
                    </li>
                    <li class="sidebar-nav-item">
                        <a href="/tab/2" class="sidebar-nav-link">
                            <span class="icon-wrapper"><i class="fas fa-credit-card"></i></span> <span>Pagos</span>
                        </a>
                    </li>
                    <li class="sidebar-nav-item">
                        <a href="/tab/6" class="sidebar-nav-link">
                            <span class="icon-wrapper"><i class="fas fa-piggy-bank"></i></span> <span>Retiros</span>
                        </a>
                    </li>
                    <li class="sidebar-nav-item">
                        <a href="/tab/3" class="sidebar-nav-link">
                            <span class="icon-wrapper"><i class="fas fa-people-group"></i></span> <span>Miembros</span>
                        </a>
                    </li>
                    <li class="sidebar-nav-item">
                        <a href="/tab/3-5" class="sidebar-nav-link">
                            <span class="icon-wrapper"><i class="fas fa-microphone"></i></span> <span>Oradores</span>
                        </a>
                    </li>
                    <li class="sidebar-nav-item">
                        <a href="/tab/4" class="sidebar-nav-link">
                            <span class="icon-wrapper"><i class="fas fa-book-open"></i></span> <span>Clases</span>
                        </a>
                    </li>
                    <li class="sidebar-nav-item">
                        <a href="/tab/5" class="sidebar-nav-link">
                            <span class="icon-wrapper"><i class="fas fa-chart-bar"></i></span> <span>Reportes</span>
                        </a>
                    </li>
                    <li class="sidebar-nav-item">
                        <a href="/tab/7" class="sidebar-nav-link">
                            <span class="icon-wrapper"><i class="fas fa-calendar"></i></span> <span>Pagos (Calendario)</span>
                        </a>
                    </li>
                </ul>
            </nav>
        </aside>
        
        <!-- CONTENT AREA -->
        <div class="content-wrapper">
            
            <!-- HEADER MODERNO -->
            <header class="header">
                <div class="header-content">
                    <div class="header-start">
                        <div class="header-title-section">
                            <h1 class="header-title">{% block page_title %}{{ config.instituto }}{% endblock %}</h1>
                        </div>
                    </div>
                </div>
            </header>
            
            <!-- CONTENIDO PRINCIPAL -->
            <main class="container">
                {% block content %}{% endblock %}
            </main>
            
        </div>
        
    </div>
    
    <!-- SCRIPTS -->
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
    {% block extra_scripts %}{% endblock %}
    
</body>
</html>
